# Dataset loader config
loader:
  _target_: topobench.data.loaders.OGBNDatasetLoader
  parameters:
    data_domain: graph
    data_type: OGBN
    data_key: ogbn-products
    data_name: products
    data_dir: ${paths.data_dir}/${dataset.loader.parameters.data_domain}/${dataset.loader.parameters.data_type}

# Dataset parameters
parameters:
  num_features: 100
  num_classes: 47
  num_nodes: 2449029
  task: classification
  loss_type: cross_entropy
  monitor_metric: accuracy
  task_level: node

# Splits
split_params:
  learning_setting: transductive
  data_split_dir: ${paths.data_dir}/data_splits/${dataset.loader.parameters.data_name}
  data_seed: 0
  split_type: random
  k: 10
  train_prop: 0.7
  standardize: false

# Dataloader parameters
dataloader_params:
  batch_size: 1
  num_workers: 0
  pin_memory: false
