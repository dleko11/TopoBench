loader:
  _target_: topobench.data.loaders.HeterophilousGraphDatasetLoader
  parameters:
    data_domain: graph
    data_type: heterophilic
    data_name: amazon_ratings
    data_dir: ${paths.data_dir}/${dataset.loader.parameters.data_domain}/${dataset.loader.parameters.data_type}
    memory_type: on_disk_cluster
    cluster: {num_parts: 128, recursive: false, keep_inter_cluster_edges: false, sparse_format: csr}
    stream: {q: 16, val_batches: 5, test_batches: 1, num_workers: 0, pin_memory: false, with_edge_attr: false, train_shuffle: true, precompute_split_parts: true}
    dtype_policy: float32
parameters: {num_features: 300, num_classes: 5, task: classification, loss_type: cross_entropy, monitor_metric: accuracy, task_level: node}
split_params:
  learning_setting: transductive
  data_split_dir: ${paths.data_dir}/data_splits/${dataset.loader.parameters.data_name}
  data_seed: 0
  split_type: random
  k: 10
  train_prop: 0.5
dataloader_params: {batch_size: 1, num_workers: 1, pin_memory: false}
