# Dataset loader config
loader:
  _target_: topobench.data.loaders.HeterophilousGraphDatasetLoader
  parameters:
    data_domain: graph
    data_type: heterophilic
    data_name: amazon_ratings
    data_dir: ${paths.data_dir}/${dataset.loader.parameters.data_domain}/${dataset.loader.parameters.data_type}

    # choose memory mode
    memory_type: on_disk_cluster

    # global partition settings
    cluster:
      num_parts: 128
      recursive: false
      keep_inter_cluster_edges: false
      sparse_format: csr

    # streaming / loader settings for block-wise training
    stream:
      q: 16
      val_batches: 5
      test_batches: 1
      num_workers: 0
      pin_memory: false
      with_edge_attr: false
      precompute_split_parts: true

    # how to store features on disk
    dtype_policy: float32

# Dataset parameters
parameters:
  num_features: 300
  num_classes: 5
  task: classification
  loss_type: cross_entropy
  monitor_metric: accuracy
  task_level: node

# splits
split_params:
  learning_setting: transductive
  data_split_dir: ${paths.data_dir}/data_splits/${dataset.loader.parameters.data_name}
  data_seed: 0
  split_type: random
  k: 10
  train_prop: 0.5

# Dataloader parameters
dataloader_params:
  batch_size: 1
  num_workers: 1
  pin_memory: False
