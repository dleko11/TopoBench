loader:
  _target_: topobench.data.loaders.GraphSAINTDatasetLoader
  parameters:
    data_domain: graph
    data_type: GraphSAINT
    data_name: Flickr
    data_dir: ${paths.data_dir}/${dataset.loader.parameters.data_domain}/${dataset.loader.parameters.data_type}

parameters:
  num_features: 500
  num_classes: 7
  num_nodes: 89250
  task: classification
  loss_type: cross_entropy
  monitor_metric: accuracy
  task_level: node

split_params:
  learning_setting: inductive
  data_split_dir: ${paths.data_dir}/data_splits/${dataset.loader.parameters.data_name}
  data_seed: 0
  split_type: fixed
  k: 10
  train_prop: 0.5
  standardize: False

dataloader_params:
  batch_size: 1
  num_workers: 0
  pin_memory: False
