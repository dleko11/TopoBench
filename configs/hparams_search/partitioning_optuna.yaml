# @package _global_

defaults:
  - override /hydra/sweeper: optuna

optimized_metric: best_epoch/${get_monitor_metric:${dataset.parameters.task},${dataset.parameters.monitor_metric}}

hydra:
  mode: MULTIRUN

  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: null
    study_name: null
    n_jobs: 1
    direction: maximize
    n_trials: 50

    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 1234
      n_startup_trials: 10

    params: {}
